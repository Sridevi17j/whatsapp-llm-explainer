<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WhatsApp Chat Explainer Settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>WhatsApp Chat Explainer Settings</h1>
      <form id="settingsForm">
        <label>
          Provider
          <select id="provider">
            <option value="gemini">Gemini, free tier key</option>
            <option value="groq">Groq, API key</option>
            <option value="openrouter">OpenRouter, API key</option>
          </select>
        </label>

        <label>
          Model
          <input id="model" type="text" placeholder="openai-fast">
        </label>

        <label>
          API key
          <input id="apiKey" type="password" placeholder="Needed for Gemini/Groq/OpenRouter">
        </label>

        <label>
          Context messages
          <input id="contextMessages" type="number" min="0" max="20" step="1">
        </label>

        <label class="checkbox-label">
          <input id="firecrawlEnabled" type="checkbox">
          Scrape selected links with Firecrawl
        </label>

        <label>
          Firecrawl API key
          <input id="firecrawlApiKey" type="password" placeholder="Required when Firecrawl scraping is enabled">
        </label>

        <label>
          Firecrawl max URLs
          <input id="firecrawlMaxUrls" type="number" min="1" max="5" step="1">
        </label>

        <p class="hint">
          Gemini is recommended for free-tier testing with your own API key.
          Firecrawl link scraping requires a Firecrawl API key.
        </p>

        <button type="submit">Save settings</button>
        <button id="testButton" class="secondary" type="button">Test provider</button>
        <div id="status"></div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
